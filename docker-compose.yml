services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4173:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8080
      CORS_ORIGIN: http://localhost:4173
      GITSCOPE_DATA_FILE: /data/gitscope-store.json
      ANALYSIS_TIMEOUT_MS: 300000
      ANALYSIS_MAX_COMMITS: 20000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - gitscope-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  gitscope-data:
